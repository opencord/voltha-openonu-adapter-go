---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation
name: Sanity Test

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

jobs:
  sanity-test:
    uses: opencord/shared-workflows/.github/workflows/sanity-test.yaml@main
    secrets: inherit
    with:
      BRANCH: ${{ github.ref_name }}
      PROJECT: ${{ github.event.repository.name }}
      REFSPEC: ${{ github.sha }}
      TEST_TARGETS: |
        - target: sanity-kind-att
          workflow: att
          flags: ""
          teardown: true
          logging: true
        - target: sanity-kind-dt
          workflow: dt
          flags: ""
          teardown: true
          logging: true
        - target: sanity-kind-tt
          workflow: tt
          flags: ""
          teardown: true
          logging: true
        - target: 1t4gem-openonu-go-adapter-test
          workflow: att
          flags: ""
          teardown: true
          logging: true
      EXTRA_HELM_FLAGS: "--set global.image_tag=master --set onos-classic.image.tag=master"
